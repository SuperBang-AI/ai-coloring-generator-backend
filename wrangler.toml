name = "coloring-generator"
main = "src/worker.ts"
compatibility_date = "2026-04-30"
[assets]
directory = "./public"
binding = "ASSETS"
[[d1_databases]]
binding = "DB"
database_name = "coloring-gen-db"
database_id = "07bf050e-b032-44bb-9cf5-535e3f508572" # 部署时由 wrangler 自动填充
[vars]
SITE_NAME = "AI Coloring Page Generator"
APP_ORIGIN = "https://aicoloringcrafter.art"
AI_PROVIDER = "zhipu"
AI_MODEL = "cogview-4"
FREE_DAILY_LIMIT = 5
REGISTERED_DAILY_LIMIT = 10
MAX_IP_DAILY_LIMIT = 30
MINUTE_RATE_LIMIT = 3
COOLDOWN_SECONDS = 60
MAX_RETRIES = 2
TURNSTILE_SITE_KEY = "" # Cloudflare Turnstile Site Key
CACHE_TTL_DAYS = 30
[env.production]
vars = { APP_ORIGIN = "https://aicoloringcrafter.art" }
[env.staging]
vars = { APP_ORIGIN = "https://staging.aicoloringmaker.com" }

[[routes]]
pattern = "aicoloringcrafter.art/*"
zone_id = "8f5c61acc0fca4f0384f614f9fc44d9f"

[[routes]]
pattern = "www.aicoloringcrafter.art/*"
zone_id = "8f5c61acc0fca4f0384f614f9fc44d9f"
